services:
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data/pgdata
    env_file:
      - .env
    environment:
      - PGDATA=/var/lib/postgresql/data/pgdata
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_DB=${POSTGRES_DB?Variable not set}

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set minio http://minio:9000 minioadmin minioadmin &&
      mc mb minio/dropzone --ignore-existing &&
      mc mb minio/inspector --ignore-existing &&
      echo 'Buckets created successfully'
      "
    restart: "no"
  #  db-initializer:
  #    image: db-init
  #    build:
  #      context: ./packages/driver_db
  #    depends_on:
  #      - db
  #    env_file:
  #      - .env
  #    environment:
  #      - POSTGRES_SERVER=db
  #      - POSTGRES_PORT=${POSTGRES_PORT}
  #      - POSTGRES_DB=${POSTGRES_DB}
  #      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
  #      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
  ##      - NEW_API_USERNAME=localapi
  ##      - NEW_API_PASSWORD=localapi
  backend:
    platform: linux/arm64
    image: "backend:latest"
    ports:
      - "4000:4000"
    volumes:
      - ./backend/:/app
      - ./packages/driver_db/:/packages/driver_db
      - ./packages/:/packages
    build:
      dockerfile: ./Dockerfile
      args:
        INSTALL_DEV: ${INSTALL_DEV-true}
    networks:
      - default
    depends_on:
      - db
      - minio
    #      - db-initializer
    env_file:
      - .env
    environment:
      - ENVIRONMENT=local
      - PYTHONPATH=/app:/packages/driver_db:/packages/shared
      - BACKEND_CORS_ORIGINS=${BACKEND_CORS_ORIGINS}
      # Override DATABASE_URL to use 'db' hostname instead of 'localhost' for container networking
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}
      - ASYNC_DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}

      - POSTGRES_SERVER=${POSTGRES_SERVER}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER?Variable not set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD?Variable not set}
      - AUTH0_DOMAIN=${AUTH0_DOMAIN}
      - AUTH0_CLIENT_ID=${AUTH0_CLIENT_ID}
      - AUTH0_AUDIENCE=${AUTH0_AUDIENCE}
      - AUTH0_MGMT_API_CLIENT_ID=${AUTH0_MGMT_API_CLIENT_ID}
      - AUTH0_MGMT_API_CLIENT_SECRET=${AUTH0_MGMT_API_CLIENT_SECRET}
      - AUTH0_MGMT_API_AUDIENCE=${AUTH0_MGMT_API_AUDIENCE}
      - AWS_REGION=${AWS_REGION?Variable not set}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID?Variable not set}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY?Variable not set}
      - PORT=4000
      - MODAL_TOKEN_ID=${MODAL_TOKEN_ID?Variable not set}
      - MODAL_TOKEN_SECRET=${MODAL_TOKEN_SECRET?Variable not set}
      - MODAL_ENVIRONMENT=${MODAL_ENVIRONMENT?dev}
      - INSTALL_DEV=true
      - INSPECTOR_BUCKET_NAME=${INSPECTOR_BUCKET_NAME?Variable not set}
      - DROPZONE_BUCKET_NAME=${DROPZONE_BUCKET_NAME?Variable not set}
volumes:
  app-db-data:
  minio-data:
